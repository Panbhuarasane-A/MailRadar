version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mailradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mailradar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Distributed Queue
  redis:
    image: redis:7-alpine
    container_name: mailradar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MailRadar Unified Application (API + SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailradar-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/mailradar?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "mailradar_jwt_access_secret_secure_key_2026"
      JWT_REFRESH_SECRET: "mailradar_jwt_refresh_secret_secure_key_2026"
      COOKIE_SECRET: "mailradar_signed_cookie_secret_key_2026"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GMAIL_CLIENT_ID: "${GMAIL_CLIENT_ID:-}"
      GMAIL_CLIENT_SECRET: "${GMAIL_CLIENT_SECRET:-}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
